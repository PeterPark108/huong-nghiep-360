{% extends "base.html" %}{% block title %}Đăng nhập – Hướng Nghiệp 360{% endblock %}{% block body %}
<div class="auth one"><div class="auth-card card"><h1>Đăng nhập</h1><p class="muted">Chào bạn quay lại 👋</p>
{% if error %}<p class="err" role="alert">{{error}}</p>{% endif %}
<form method="post" class="fm"><input type="hidden" name="_csrf" value="{{csrf_token()}}"><input type="hidden" name="next" value="{{next}}">
<label class="fl"><span>Tên đăng nhập</span><input name="username" value="{{username}}" autocomplete="username" autocapitalize="none" required></label>
<label class="fl"><span>Mật khẩu</span><span class="pw"><input type="password" name="password" id="pw" autocomplete="current-password" required><button type="button" class="eye" data-eye="pw" aria-label="Hiện mật khẩu" aria-pressed="false">Hiện</button></span></label>
<button class="btn full">Đăng nhập</button></form>
<p class="small muted">Chưa có tài khoản? <a href="/dang-ky">Đăng ký</a></p></div></div>{% endblock %}
